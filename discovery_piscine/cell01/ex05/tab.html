<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
</head>

<body>

    <table style="width: 100%; height: 150px; border-collapse: collapse;">
        <tr>
            <td style="background-color: lightblue; border: 1px solid black;">
                First cell
            </td>

            <td style="background-color: lightpink; border: 1px solid black;">
                Second cell
            </td>
        </tr>
    </table>

</body>
</html>
